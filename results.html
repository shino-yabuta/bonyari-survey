<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調査結果｜「ぼんやり」の感じ方の調査</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
  :root {
    --pico-font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    --pico-primary: #1c1b1a; --pico-primary-hover: #3a3936;
    --pico-background-color: #fafaf9; --pico-color: #1c1b1a;
  }
  main { max-width:600px; margin:0 auto; padding:0 0 64px; display:flex; flex-direction:column; gap:40px; }
  .pad { padding:0 16px; }
  h1 { margin:32px 0 12px; font-size:1.25rem; }
  header p { margin:0; font-size:.95rem; line-height:1.75; text-wrap:pretty; }
  h2 { font-size:1rem; margin:0; }
  section { display:flex; flex-direction:column; gap:12px; }
  .frame { width:100%; overflow:hidden; line-height:0; }
  .frame img { width:100%; height:auto; display:block; }
  .tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
  .tabs button {
    margin:0; padding:8px 4px; min-height:52px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
    font-size:.85rem; line-height:1.2; background:#fff; color:#1c1b1a;
    border:1px solid #d6d3d1; border-radius:6px;
  }
  .tabs button small { display:none; font-size:.75rem; font-variant-numeric:tabular-nums; }
  .tabs button[aria-pressed="true"] small { display:block; }
  .tabs button[aria-pressed="true"] { background:#1c1b1a; color:#fff; border-color:#1c1b1a; }
  .tabs button[aria-pressed="true"] small { color:#d6d3d1; }
  .ages { padding:0 16px; display:flex; flex-wrap:wrap; gap:6px; }
  .ages button { margin:0; padding:6px 12px; font-size:.85rem; background:#fff; color:#1c1b1a; border:1px solid #d6d3d1; border-radius:999px; display:flex; gap:6px; align-items:baseline; }
  .ages button small { font-size:.75rem; color:#78716c; font-variant-numeric:tabular-nums; }
  .ages button[aria-pressed="true"] { background:#1c1b1a; color:#fff; border-color:#1c1b1a; }
  .ages button[aria-pressed="true"] small { color:#d6d3d1; }
  .ages button:disabled { opacity:.4; }
  .note { font-size:.8rem; color:var(--pico-muted-color); line-height:1.7; margin:0; }
</style>
</head>
<body>
<main>
  <div style="display:flex;flex-direction:column;gap:0">
    <header class="pad" style="padding-bottom:16px">
      <h1>調査結果</h1>
      <p>それぞれの写真で「ぼんやりしている」と感じ始めた位置の、最低・平均・中央値・最高のぼかしを切り替えて見られます。数値はアンケートのスライダーの位置（0〜100%）です。写真はアンケートと同じ大きさで表示しています。</p>
    </header>
    <div class="ages" id="ages"></div>
  </div>
  <div id="results" style="display:flex;flex-direction:column;gap:56px"></div>
  <section class="pad">
    <h2>回答の分布</h2>
    <p class="note">1つの点が1人の回答です。黒い線は平均、オレンジの点線は中央値です。</p>
    <svg id="scatter" viewBox="0 0 560 360" style="width:100%;height:auto;display:block" role="img" aria-label="写真ごとの回答の散布図"></svg>
  </section>
</main>

<script>
const BASE_WIDTH = 600;
const MAX_BLUR = 30; // スライダー100 = 30px（600px幅基準）
// 回答：[年代, 写真1, 写真2, 写真3]（スライダー値 0〜100）。回答が増えたらここを更新
const RESPONSES = [
  ["40代", 19, 21, 19],
  ["30代", 9, 5, 8],
  ["40代", 5, 4, 2],
  ["30代", 7, 14, 15],
  ["70代以上", 9, 18, 14],
  ["40代", 12, 14, 13],
  ["10代", 31, 50, 38],
  ["40代", 10, 11, 10],
  ["40代", 19, 41, 23],
  ["40代", 36, 48, 46],
  ["50代", 14, 35, 46],
  ["40代", 18, 42, 58],
  ["40代", 22, 41, 100],
  ["30代", 31, 40, 37],
  ["30代", 12, 26, 23],
  ["40代", 2, 2, 4],
  ["50代", 29, 36, 42],
  ["70代以上", 25, 25, 19],
  ["40代", 7, 6, 10],
  ["70代以上", 65, 60, 63],
  ["40代", 4, 7, 6],
  ["70代以上", 7, 59, 61],
  ["10代", 33, 39, 37],
  ["40代", 16, 8, 43],
  ["30代", 1, 16, 15],
  ["40代", 14, 23, 21],
  ["40代", 14, 18, 12],
  ["40代", 7, 10, 9],
  ["40代", 20, 34, 30],
  ["20代", 23, 23, 20],
  ["40代", 9, 13, 12],
  ["50代", 18, 18, 16],
  ["30代", 9, 13, 8],
  ["30代", 17, 17, 25],
  ["70代以上", 12, 13, 18],
];
const AGES = ["10代", "20代", "30代", "40代", "50代", "60代", "70代以上"];
const SLIDER = [1, 2, 3].map(i => RESPONSES.map(r => r[i]));
const SRCS = ["images/photo1.jpg", "images/photo2.jpg", "images/photo3.jpg"];
const toPx = v => v / 100 * MAX_BLUR;
function median(vals) {
  const v = [...vals].sort((a, b) => a - b), n = v.length;
  return n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2;
}
let age = "all";
const filtered = () => RESPONSES.filter(r => age === "all" || r[0] === age);
const stats = (vals, i) => ({
  src: SRCS[i],
  min: toPx(Math.min(...vals)),
  avg: toPx(vals.reduce((a, b) => a + b, 0) / vals.length),
  med: toPx(median(vals)),
  max: toPx(Math.max(...vals)),
});
const RESULTS = SLIDER.map(stats);
const KINDS = [["orig", "元画像"], ["min", "最低"], ["avg", "平均"], ["med", "中央値"], ["max", "最高"]];
const DEFAULT_KIND = "orig";
const pct = v => Math.round(v / MAX_BLUR * 100) + "%";

const root = document.getElementById("results");
const items = RESULTS.map((r, i) => {
  const sec = document.createElement("section");
  sec.innerHTML = `
    <h2 class="pad">写真 ${i + 1}</h2>
    <div class="frame"><img src="${r.src}" alt="写真${i + 1}"></div>
    <div class="tabs pad">${KINDS.map(([k, label]) => `
      <button type="button" data-kind="${k}" aria-pressed="false">${label}${k === "orig" ? "" : `<small data-v="${k}">${pct(r[k])}</small>`}</button>`).join("")}
    </div>`;
  root.appendChild(sec);
  const item = { r, img: sec.querySelector("img"), frame: sec.querySelector(".frame"), btns: sec.querySelectorAll("button"), kind: DEFAULT_KIND };
  item.btns.forEach(b => b.addEventListener("click", () => { item.kind = b.dataset.kind; apply(item); }));
  return item;
});

// アンケートと同じく、表示幅に比例させる
function apply(item) {
  const base = item.kind === "orig" ? 0 : item.r[item.kind];
  const w = item.frame.clientWidth || BASE_WIDTH;
  item.img.style.filter = `blur(${(base * w / BASE_WIDTH).toFixed(2)}px)`;
  item.btns.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === item.kind)));
}
items.forEach(apply);
window.addEventListener("resize", () => items.forEach(apply));

function drawScatter() {
  const svg = document.getElementById("scatter");
  const W = 560, H = 360, L = 44, R = 12, T = 12, B = 36;
  const pw = W - L - R, ph = H - T - B, colW = pw / 3;
  const y = v => T + ph - v / 100 * ph;
  let s = "";
  [0, 25, 50, 75, 100].forEach(v => {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="#e7e5e4"/>`;
    s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#78716c">${v}%</text>`;
  });
  let seed = 7;
  const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const rows = filtered();
  [1, 2, 3].map(i => rows.map(r => r[i])).forEach((vals, i) => {
    const cx = L + colW * i + colW / 2;
    vals.forEach(v => {
      const x = cx + (rand() - 0.5) * colW * 0.5;
      s += `<circle cx="${x.toFixed(1)}" cy="${y(v).toFixed(1)}" r="5" fill="#1c1b1a" fill-opacity="0.35"/>`;
    });
    const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    s += `<line x1="${cx - colW * 0.32}" x2="${cx + colW * 0.32}" y1="${y(avg)}" y2="${y(avg)}" stroke="#1c1b1a" stroke-width="2.5"/>`;
    const med = median(vals);
    s += `<line x1="${cx - colW * 0.32}" x2="${cx + colW * 0.32}" y1="${y(med)}" y2="${y(med)}" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="6 4"/>`;
    s += `<text x="${cx}" y="${H - 12}" text-anchor="middle" font-size="13" fill="#1c1b1a">写真 ${i + 1}</text>`;
  });
  svg.innerHTML = s;
}

function update() {
  const rows = filtered();
  items.forEach((item, i) => {
    item.r = stats(rows.map(r => r[i + 1]), i);
    item.btns.forEach(b => { const sm = b.querySelector("small"); if (sm) sm.textContent = pct(item.r[sm.dataset.v]); });
    apply(item);
  });
  document.querySelectorAll("#ages button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.age === age)));
  drawScatter();
}
const agesEl = document.getElementById("ages");
[["all", "全員"], ...AGES.map(a => [a, a])].forEach(([key, label]) => {
  const n = key === "all" ? RESPONSES.length : RESPONSES.filter(r => r[0] === key).length;
  const b = document.createElement("button");
  b.type = "button"; b.dataset.age = key; b.disabled = n === 0;
  b.textContent = label;
  b.addEventListener("click", () => { age = key; update(); });
  agesEl.appendChild(b);
});
update();
</script>
</body>
</html>
