<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>「ぼんやり」の感じ方の調査</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
  :root {
    --pico-font-family: -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    --pico-primary: #1c1b1a; --pico-primary-background: #1c1b1a; --pico-primary-border: #1c1b1a;
    --pico-primary-hover: #3a3936; --pico-primary-hover-background: #3a3936; --pico-primary-hover-border: #3a3936;
    --pico-primary-focus: rgba(28,27,26,.2); --pico-primary-inverse: #fff;
    --pico-background-color: #fafaf9; --pico-color: #1c1b1a;
  }
  html { font-size: 100%; }
  main { max-width:600px; margin:0 auto; padding:0 0 64px; display:flex; flex-direction:column; gap:48px; }
  .pad { padding:0 16px; }
  h1 { margin:32px 0 12px; font-size:1.25rem; }
  header p { margin:0; font-size:.95rem; line-height:1.75; text-wrap:pretty; }
  .item { display:flex; flex-direction:column; gap:12px; }
  .label { font-size:.8rem; color:var(--pico-muted-color); }
  .frame { width:100%; overflow:hidden; line-height:0; }
  .frame img { width:100%; height:auto; display:block; }
  input[type=range] { margin:8px 0 0; height:44px; }
  input[type=range]::-webkit-slider-runnable-track { height:8px; border-radius:4px; }
  input[type=range]::-moz-range-track { height:8px; border-radius:4px; }
  input[type=range]::-webkit-slider-thumb { width:32px; height:32px; margin-top:-12px; }
  input[type=range]::-moz-range-thumb { width:32px; height:32px; }
  .ends { display:flex; justify-content:space-between; font-size:.8rem; color:var(--pico-muted-color); margin-top:6px; }
  .survey { display:flex; flex-direction:column; gap:8px; padding-top:32px; border-top:1px solid var(--pico-muted-border-color); }
  legend { font-weight:600; }
  .radios { display:flex; flex-wrap:wrap; gap:8px 28px; }
  .radios label { margin:0; }
  .survey button { width:100%; margin-top:8px; }
  .note { font-size:.8rem; color:var(--pico-muted-color); }
  .thanks { padding:120px 16px; text-align:center; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main id="form">
  <header class="pad">
    <h1>「ぼんやり」の感じ方の調査</h1>
    <p>写真ごとに「ここから先は『ぼんやり』している」と感じる位置でスライダーを止めてください。写真は3枚あります。全てに回答してから送信してください。</p>
  </header>

  <div id="items" style="display:flex;flex-direction:column;gap:48px"></div>

  <section class="survey pad">
    <fieldset>
      <legend>年代</legend>
      <select id="age">
        <option value="">選択してください</option>
        <option>10代未満</option><option>10代</option><option>20代</option><option>30代</option>
        <option>40代</option><option>50代</option><option>60代</option><option>70代以上</option>
      </select>
    </fieldset>
    <fieldset>
      <legend>性別</legend>
      <div class="radios">
        <label><input type="radio" name="gender" value="男性">男性</label>
        <label><input type="radio" name="gender" value="女性">女性</label>
        <label><input type="radio" name="gender" value="その他">その他</label>
      </div>
    </fieldset>
    <button id="submit" disabled>送信</button>
    <div class="note" id="note">すべての写真でスライダーを動かし、年代と性別を選ぶと送信できます。</div>
  </section>
</main>

<div class="thanks" id="thanks" hidden>
  <p>ご協力ありがとうございました。</p>
  <a href="results.html" role="button">これまでの結果を見る</a>
</div>

<script>
/* ===== 設定 ===== */
const CONFIG = {
  // Apps Script のウェブアプリURL（空のままだと送信せずコンソールに出力）
  ENDPOINT: "https://script.google.com/macros/s/AKfycbyg2egtjkwuJB7AaTSB0GUOFJZFAcBGWO3ZidOmpoAbLY-GZiDyYpjM7qhVwYYF5ioo0Q/exec",
  // 写真のファイル名（site/images/ に置く）。並び順がそのまま表示順
  IMAGES: ["images/photo1.jpg", "images/photo2.jpg", "images/photo3.jpg"],
  // 基準：写真の表示幅がこのpxのとき、スライダー100 = MAX_BLUR px
  BASE_WIDTH: 600,
  MAX_BLUR: 30,
};

/* ===== 写真とスライダー ===== */
const items = document.getElementById("items");
const state = CONFIG.IMAGES.map((src, i) => ({ id: "photo" + (i + 1), src, value: 0, touched: false }));

state.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "item";
  el.innerHTML = `
    <div class="label pad">写真 ${i + 1} / ${state.length}</div>
    <div class="frame"><img src="${s.src}" alt="写真${i + 1}"></div>
    <div class="pad">
      <input type="range" min="0" max="100" step="1" value="0" aria-label="写真${i + 1}のぼかし">
      <div class="ends"><span>0</span><span>100</span></div>
    </div>`;
  items.appendChild(el);
  s.img = el.querySelector("img");
  s.frame = el.querySelector(".frame");
  const range = el.querySelector("input");
  range.addEventListener("input", () => {
    s.value = Number(range.value);
    s.touched = true;
    applyBlur(s);
    validate();
  });
  applyBlur(s);
});

// ぼかし量は表示幅に比例させる（どの端末でも写真に対する相対的なぼけ具合が同じになる）
function applyBlur(s) {
  const w = s.frame.clientWidth || CONFIG.BASE_WIDTH;
  // 値0 = ぼかし0、値100 = MAX_BLUR
  const px = (s.value / 100) * CONFIG.MAX_BLUR * (w / CONFIG.BASE_WIDTH);
  s.img.style.filter = `blur(${px.toFixed(2)}px)`;
}
window.addEventListener("resize", () => state.forEach(applyBlur));

/* ===== アンケートと送信 ===== */
const ageEl = document.getElementById("age");
const btn = document.getElementById("submit");
const note = document.getElementById("note");
const gender = () => (document.querySelector('input[name="gender"]:checked') || {}).value || "";

function validate() {
  const ok = state.every(s => s.touched) && ageEl.value && gender();
  btn.disabled = !ok;
  return ok;
}
ageEl.addEventListener("change", validate);
document.querySelectorAll('input[name="gender"]').forEach(r => r.addEventListener("change", validate));

function deviceType() {
  const ua = navigator.userAgent;
  if (/iPad|Tablet/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return "tablet";
  if (/Mobi|Android|iPhone/i.test(ua)) return "smartphone";
  return "pc";
}

btn.addEventListener("click", async () => {
  if (!validate()) return;
  btn.disabled = true;
  note.textContent = "送信中…";
  const data = {
    submitted_at: new Date().toISOString(),
    age: ageEl.value,
    gender: gender(),
  };
  const w = state[0].frame.clientWidth;
  state.forEach(s => {
    data[s.id] = s.value;
    data[s.id + "_blur_base_px"] = +((s.value / 100) * CONFIG.MAX_BLUR).toFixed(2);
    data[s.id + "_blur_actual_px"] = +((s.value / 100) * CONFIG.MAX_BLUR * (w / CONFIG.BASE_WIDTH)).toFixed(2);
  });
  Object.assign(data, {
    device: deviceType(),
    viewport: `${window.innerWidth}x${window.innerHeight}`,
    screen: `${screen.width}x${screen.height}`,
    image_width: state[0].frame.clientWidth,
    dpr: window.devicePixelRatio,
    user_agent: navigator.userAgent,
  });

  try {
    if (CONFIG.ENDPOINT) {
      await fetch(CONFIG.ENDPOINT, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data),
      });
    } else {
      console.log("[ENDPOINT未設定] 送信データ:", data);
    }
    document.getElementById("form").hidden = true;
    document.getElementById("thanks").hidden = false;
    window.scrollTo(0, 0);
  } catch (e) {
    note.textContent = "送信に失敗しました。通信環境を確認して、もう一度お試しください。";
    btn.disabled = false;
  }
});
</script>
</body>
</html>
